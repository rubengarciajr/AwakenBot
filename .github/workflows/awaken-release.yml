name: AwakenBot release

# How AwakenBot ships: push a new version to main, and members' apps update themselves.
#
#   bun scripts/awaken/version.ts   # 1.0.0 -> 1.0.1
#   git commit -am "AwakenBot 1.0.1" && git push
#
# Every push to main runs this. When package.json names a version with no vX.Y.Z tag yet, it:
#   1. checks the AwakenBot branding is fully applied (scripts/awaken/apply.ts --check),
#   2. builds every container image into ghcr.io/<owner>/<repo>-* (the upstream images workflow),
#   3. builds the Mac app (Apple silicon), ad-hoc signed, with the updater signed by AwakenBot's own
#      key (secret AWAKEN_UPDATER_PRIVATE_KEY; public half in brand/updater-public.key),
#   4. publishes GitHub Release vX.Y.Z as Latest, with container-images.json (what the app installs),
#      the DMG, and latest.json + AwakenBot.app.tar.gz (what installed apps update from).
# A push whose version is already released does nothing past step 1's version check.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awaken-release
  cancel-in-progress: false

env:
  OPENBOT_DISTRIBUTION_ID: ${{ github.repository }}
  OPENBOT_RELEASE_REPOSITORY: ${{ github.repository }}
  OPENBOT_RELEASE_CHANNEL: stable

jobs:
  plan:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: AwakenBot branding is fully applied
        run: bun scripts/awaken/apply.ts --check
      - name: Is this version released yet?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::package.json version '$version' is not X.Y.Z"; exit 1; }
          bun desktop/scripts/desktop-version.ts check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do. Run \`bun scripts/awaken/version.ts\` to release a new one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version from \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  images:
    name: images
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      tags: v${{ needs.plan.outputs.version }}
      latest: true
      manifest_version: v${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  mac:
    name: mac app
    needs: plan
    if: needs.plan.outputs.release == 'true'
    # A named image rather than macos-latest: on 2026-11-11 jobs on macos-latest went unclaimed for
    # 15 minutes and were dropped. macos-15 is Apple silicon, which the app is built for.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      # The whole history: build.rs reads the commit the app was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Prepare the release version
        run: bun scripts/desktop-version.ts release
        working-directory: desktop
      # The CopilotKit CLI and its Node runtime, which set up the local Intelligence AwakenBot runs on.
      - name: Bundle the CLI
        run: bun desktop/scripts/cli-bundle.ts darwin arm64
      # A stable, unpinned build with the updater: it installs this release from this repository's
      # releases, and later updates itself from this repository's latest.json, checked against
      # AwakenBot's own public key. Ad-hoc signed ("-"): no Apple Developer ID yet.
      - name: Build the app, the DMG and the signed update
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
          OPENBOT_BUNDLED_CLI: "1"
          OPENBOT_SHELL_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.AWAKEN_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.AWAKEN_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          OPENBOT_SHELL_UPDATE_PUBLIC_KEY="$(tr -d '\n' < ../brand/updater-public.key)"
          export OPENBOT_SHELL_UPDATE_PUBLIC_KEY
          bun scripts/build-shell-update.ts --bundles app,dmg \
            --config src-tauri/tauri.build-version.conf.json \
            --config src-tauri/tauri.bundled-cli.conf.json
      - name: Collect the release files
        env:
          OPENBOT_SHELL_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.plan.outputs.version }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          bun desktop/scripts/collect-shell-update.ts
          mkdir -p release
          cp desktop/dist/shell-updates/*.app.tar.gz desktop/dist/shell-updates/*.app.tar.gz.sig release/
          cp desktop/dist/shell-updates/fragment-darwin-aarch64.json release/latest.json
          dmgs=(desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          # A fixed name too, so a download link never changes between versions.
          cp "${dmgs[0]}" "release/AwakenBot_${VERSION}_mac-apple-silicon.dmg"
          cp "${dmgs[0]}" release/AwakenBot-mac.dmg
          ls -la release
          cat release/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awaken-mac
          path: release/
          retention-days: 30

  release:
    name: publish
    needs: [plan, images, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.images.outputs.manifest-artifact }}
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: awaken-mac
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The notes: this version's section of docs/changelog.md, or a plain line without one.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' docs/changelog.md > notes.md || true
          if ! grep -q '[^[:space:]]' notes.md; then echo "AwakenBot $VERSION" > notes.md; fi
          cat >> notes.md <<EOF

          ### Install
          Download **AwakenBot-mac.dmg** (Apple silicon Macs), open it and drag AwakenBot to Applications.
          The first time, right-click AwakenBot in Applications and choose **Open**. Later versions install themselves.
          EOF
          gh release create "v$VERSION" \
            --repo "$REPOSITORY" \
            --target "$SHA" \
            --title "AwakenBot $VERSION" \
            --notes-file notes.md \
            --latest \
            release/*
